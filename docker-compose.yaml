name: "pegnia-sidecar-dev"

volumes:
  gamedata:
    driver: local

services:
  gameserver:
    image: itzg/minecraft-server
    environment:
      - EULA=TRUE
    volumes:
      - gamedata:/data
    ports:
      - "9999:9999"

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "service:gameserver"
    environment:
      - SIDECAR_API_ADDR=:9999
      - SIDECAR_DATA_ROOT=/data
      - SIDECAR_RATE_LIMIT=60
      # Requests need the header X-API-Key: change-me
      - SIDECAR_API_KEY=change-me
    volumes:
      - gamedata:/data
